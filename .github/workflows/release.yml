name: Build isolated 2S-UI pilot (fork only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-pilot-build
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'jonathanfan-ee/2s-ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_COMMIT: f20ee45ef2b75fce78cc2eebce01cd156d60d33b
      BUILD_TAGS: with_quic,with_grpc,with_utls,with_acme,with_gvisor,badlinkname,tfogo_checklinkname0,with_tailscale,with_cloudflared,with_openconnect,with_openvpn,with_usbip
      CGO_ENABLED: '1'
      GOOS: linux
      GOARCH: amd64
      CC: musl-gcc
    steps:
      - name: Checkout fixed application revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f20ee45ef2b75fce78cc2eebce01cd156d60d33b
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Install musl compiler on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
      - name: Build both web interfaces
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Embed built interfaces
        run: |
          mkdir -p web/html sub/dashboard
          cp -R frontend/dist/. web/html/
          cp -R frontend/subscriber/dist/. sub/dashboard/
      - name: Validate source and tests
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          go mod download github.com/sagernet/sing-box
          bash scripts/check-protocol-copies.sh
          go vet -tags "$BUILD_TAGS" ./...
          go test -tags "$BUILD_TAGS" -ldflags='-checklinkname=0' ./...
          python3 -B -m unittest discover -s collector/tests
      - name: Build static pilot binary
        run: |
          mkdir -p pilot-artifact
          go build -trimpath -tags "$BUILD_TAGS" -ldflags="-w -s -checklinkname=0 -linkmode external -extldflags '-static'" -o pilot-artifact/sui .
          file pilot-artifact/sui
          if readelf -l pilot-artifact/sui | grep -q 'INTERP'; then exit 1; fi
          if readelf -d pilot-artifact/sui 2>/dev/null | grep -q '(NEEDED)'; then exit 1; fi
          ./pilot-artifact/sui -v
          go version -m pilot-artifact/sui > pilot-artifact/go-build-info.txt
          grep -F "vcs.revision=$SOURCE_COMMIT" pilot-artifact/go-build-info.txt
          python3 - <<'METADATA'
          import json,os,hashlib,pathlib
          path=pathlib.Path('pilot-artifact/sui')
          info={'sourceCommit':os.environ['SOURCE_COMMIT'],'workflowRef':os.environ['GITHUB_WORKFLOW_REF'],'runId':os.environ['GITHUB_RUN_ID'],'platform':'linux/amd64','binarySha256':hashlib.sha256(path.read_bytes()).hexdigest(),'buildTags':os.environ['BUILD_TAGS']}
          pathlib.Path('pilot-artifact/build-metadata.json').write_text(json.dumps(info,indent=2)+'\n')
          METADATA
          cd pilot-artifact
          sha256sum sui > SHA256SUMS
          cd ..
          tar -czf 2s-ui-pilot-linux-amd64-f20ee45.tar.gz -C pilot-artifact .
          sha256sum 2s-ui-pilot-linux-amd64-f20ee45.tar.gz > 2s-ui-pilot-linux-amd64-f20ee45.tar.gz.sha256
      - name: Upload reviewable build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 2s-ui-pilot-linux-amd64-f20ee45
          path: |
            2s-ui-pilot-linux-amd64-f20ee45.tar.gz
            2s-ui-pilot-linux-amd64-f20ee45.tar.gz.sha256
          retention-days: 14
